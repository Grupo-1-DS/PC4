---
apiVersion: v1
kind: Service
metadata:
  name: pc4-app-root-service
  labels:
    app: pc4-app-root
spec:
  type: NodePort
  selector:
    app: pc4-app-root
  ports:
  - name: http
    protocol: TCP
    port: 8000
    targetPort: 8000
    nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: pc4-app-nonroot-service
  labels:
    app: pc4-app-nonroot
spec:
  type: NodePort
  selector:
    app: pc4-app-nonroot
  ports:
  - name: http
    protocol: TCP
    port: 8000
    targetPort: 8000
    nodePort: 30081
