apiVersion: apps/v1
kind: Deployment
metadata:
  name: pc4-app-root
  labels:
    app: pc4-app-root
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pc4-app-root
  template:
    metadata:
      labels:
        app: pc4-app-root
    spec:
      containers:
      - name: pc4-app-root
        image: pc4-app-root:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
